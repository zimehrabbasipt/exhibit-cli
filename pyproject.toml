[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "exhibit-cli"
version = "0.1.1"
description = "AI-powered data analysis CLI that treats analysis as a persistent, resumable investigation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Business Source License 1.1" }
authors = [{ name = "Zimehr Abbasi", email = "zimehrabbasigh@gmail.com" }]
keywords = ["data-analysis", "cli", "duckdb", "llm", "sql", "analytics", "claude", "investigation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Database :: Front-Ends",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "duckdb>=1.0",
    "pydantic>=2.7",
    "sqlglot>=25.0",
    "matplotlib>=3.8",
    "plotext>=5.2",
    "numpy>=1.24",
    "scipy>=1.10",
    "anthropic>=0.69",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
exhibit = "exhibit.cli:app"

[project.urls]
Homepage = "https://github.com/ziwalker/exhibit-cli"
Repository = "https://github.com/ziwalker/exhibit-cli"
Issues = "https://github.com/ziwalker/exhibit-cli/issues"

[tool.setuptools.packages.find]
include = ["exhibit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
